<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find all Nota's social media and online links in one place.">
    <title>Nota | Made to be yours</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Logo and Tagline Section -->
        <header class="header">
            <img src="Nota Logo.png" alt="Nota Logo" class="logo-image">
            <p class="tagline">Made to be yours ♡</p>
        </header>

        <!-- Social Links Section -->
        <main class="social-links">
            <!-- Social buttons will be dynamically generated by JavaScript -->
            <div id="social-buttons"></div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p class="footer-text">Follow us for more ✨</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
